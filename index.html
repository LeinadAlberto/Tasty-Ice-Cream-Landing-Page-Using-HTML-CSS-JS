<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="description"
            content="Discover delicious, creamy ice cream in refreshing flavors like mint chocolate chip, 
            cookies and cream, and vanilla. Choose your favorite and order today.">
        <meta name="robots" content="index, follow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--=============== FAVICON ===============-->
        <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

        <!--=============== REMIXICONS ===============-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

        <!--=============== SWIPER CSS ===============-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.css">

        <!--=============== CSS ===============-->
        <link rel="stylesheet" href="assets/css/styles.css">

        <title>Delicious Ice Cream | Fresh & Creamy Flavors | LokyWebDev</title>
    </head>

    <body>
        <!--==================== HEADER ====================-->
        <header class="header" id="header">
            <nav class="nav container">
                <a href="/index.html" class="nav__logo">Ice Cream</a>

                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list">
                        <li>
                            <a href="#" class="nav__link active__link">Home</a>
                        </li>
    
                        <li>
                            <a href="#" class="nav__link">Menu</a>
                        </li>
    
                        <li>
                            <a href="#" class="nav__link">About</a>
                        </li>
    
                        <li>
                            <a href="#" class="nav__link">Contact</a>
                        </li>
                    </ul>

                    <!-- Close -->
                    <button class="nav__close" id="nav-close" aria-label="Close menu">
                        <i class="ri-close-large-line"></i>
                    </button>
                </div><!-- /.nav__menu -->

                <div class="nav__actions">
                    <a href="#" class="nav__action" aria-label="Account">
                        <i class="ri-account-circle-line"></i>
                    </a>

                    <a href="#" class="nav__action" aria-label="Shopping bag">
                        <i class="ri-shopping-bag-3-line"></i>
                    </a>

                    <!-- Toggle -->
                    <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
                        <i class="ri-apps-2-line"></i>
                    </button>
                </div><!-- /.nav__actions -->
            </nav>
        </header>

        <!--==================== MAIN ====================-->
        <main class="main">
            <!--==================== HOME ====================-->
            <section class="home">
                <div class="home__bg home__green active-bg"></div>
                <div class="home__bg home__brown"></div>
                <div class="home__bg home__blue"></div>

                <div class="home__container container">
                    <div class="home__swiper">
                        <div>
                            <article class="home__card">
                                <img src="assets/img/ice-cream-1.png" alt="" class="home__img">
                            </article>

                            <article class="home__card">
                                <img src="assets/img/ice-cream-2.png" alt="" class="home__img">
                            </article>

                            <article class="home__card">
                                <img src="assets/img/ice-cream-3.png" alt="" class="home__img">
                            </article>
                        </div>
                    </div><!-- /.home__swiper -->

                    <div class="home__data">
                        <h1 class="home__title">Delicious <br> Ice Cream</h1>

                        <p class="home__description">
                            A refreshing ice cream, crafted to turn every spoonful
                            into a moment of sweetness, freshness, and pleasure.
                        </p>

                        <div class="home__buttons">
                            <a href="#" class="home__button">Order Now</a>
                            <a href="#" class="home__button home__button-ghost">View Flavors</a>
                        </div><!-- /.home__buttons -->
                    </div><!-- /.home__data -->


                    <img src="assets/img/waves-img.svg" alt="" class="home__wave">

                    <div class="home__bottom">
                        <div class="home__arrows">

                        </div><!-- /.home__arrows -->

                        <div class="home__reviews">
                            <div class="home__people">
                                <img src="assets/img/review-1.png" alt="" class="home__person">
                                <img src="assets/img/review-2.png" alt="" class="home__person">
                                <img src="assets/img/review-3.png" alt="" class="home__person">
                            </div><!-- /.home__people -->

                            <div>
                                <h3 class="home__reviews-title">10k Reviews</h3>
                                <p class="home__reviews-description">Our customers prefer us.</p>
                            </div>
                        </div><!-- /.home__reviews -->
                    </div><!-- /.home__bottom -->
                </div><!-- /.home__container -->
            </section>
        </main>

        <!--=============== GSAP ===============-->
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

        <!--=============== SWIPER JS ===============-->
        <script src="https://cdn.jsdelivr.net/npm/swiper@8.4.7/swiper-bundle.min.js"></script>

        <!--=============== MAIN JS ===============-->
        <script src="assets/js/main.js"></script>
    </body>

</html>
